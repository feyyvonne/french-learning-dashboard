<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>French A2 Learning Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#17202a",
              mint: "#4fb286",
              skysoft: "#dff3f7",
              coral: "#f06f5f",
              lemon: "#fff5c7",
              lilac: "#ece8ff"
            },
            boxShadow: {
              soft: "0 18px 55px rgba(23, 32, 42, 0.12)"
            }
          }
        }
      };
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      .word-block .word-meaning {
        opacity: 0;
      }

      .word-block:hover .word-meaning,
      .word-block:focus-within .word-meaning {
        opacity: 1;
      }
    </style>
  </head>
  <body class="bg-[#f7fbfa] text-ink antialiased">
    <div id="root"></div>
    <script type="text/babel">
      const { useMemo, useState } = React;

      const wordBank = [
        { id: 1, french: "un rendez-vous", english: "an appointment", theme: "Daily life" },
        { id: 2, french: "la météo", english: "the weather", theme: "Daily life" },
        { id: 3, french: "chercher", english: "to look for", theme: "Useful verbs" },
        { id: 4, french: "déjà", english: "already", theme: "Common words" },
        { id: 5, french: "la gare", english: "the train station", theme: "Travel" },
        { id: 6, french: "un conseil", english: "a piece of advice", theme: "Conversation" },
        { id: 7, french: "ranger", english: "to tidy", theme: "Home" },
        { id: 8, french: "la facture", english: "the bill", theme: "Shopping" },
        { id: 9, french: "souvent", english: "often", theme: "Common words" },
        { id: 10, french: "pourtant", english: "however", theme: "Common words" },
        { id: 11, french: "un voisin", english: "a neighbor", theme: "People" },
        { id: 12, french: "la clé", english: "the key", theme: "Home" },
        { id: 13, french: "essayer", english: "to try", theme: "Useful verbs" },
        { id: 14, french: "une réunion", english: "a meeting", theme: "Work" },
        { id: 15, french: "le quartier", english: "the neighborhood", theme: "Places" },
        { id: 16, french: "une ordonnance", english: "a prescription", theme: "Health" },
        { id: 17, french: "remplir", english: "to fill", theme: "Useful verbs" },
        { id: 18, french: "un billet", english: "a ticket", theme: "Travel" },
        { id: 19, french: "prêter", english: "to lend", theme: "Conversation" },
        { id: 20, french: "la taille", english: "the size", theme: "Shopping" },
        { id: 21, french: "une habitude", english: "a habit", theme: "Daily life" },
        { id: 22, french: "un choix", english: "a choice", theme: "Common words" },
        { id: 23, french: "se dépêcher", english: "to hurry", theme: "Useful verbs" },
        { id: 24, french: "un escalier", english: "a staircase", theme: "Places" },
        { id: 25, french: "la douleur", english: "pain", theme: "Health" },
        { id: 26, french: "un reçu", english: "a receipt", theme: "Shopping" },
        { id: 27, french: "prévenir", english: "to warn", theme: "Useful verbs" },
        { id: 28, french: "d'habitude", english: "usually", theme: "Common words" },
        { id: 29, french: "le chauffage", english: "heating", theme: "Home" },
        { id: 30, french: "une annonce", english: "an announcement", theme: "Work" },
        { id: 31, french: "un arrêt", english: "a stop", theme: "Travel" },
        { id: 32, french: "discuter", english: "to discuss", theme: "Conversation" },
        { id: 33, french: "propre", english: "clean", theme: "Home" },
        { id: 34, french: "une réduction", english: "a discount", theme: "Shopping" },
        { id: 35, french: "un médecin", english: "a doctor", theme: "Health" },
        { id: 36, french: "en retard", english: "late", theme: "Daily life" },
        { id: 37, french: "un dossier", english: "a file", theme: "Work" },
        { id: 38, french: "un piéton", english: "a pedestrian", theme: "Places" },
        { id: 39, french: "répondre", english: "to answer", theme: "Useful verbs" },
        { id: 40, french: "une erreur", english: "a mistake", theme: "Common words" },
        { id: 41, french: "un frigo", english: "a fridge", theme: "Home" },
        { id: 42, french: "une carte bancaire", english: "a bank card", theme: "Shopping" },
        { id: 43, french: "tomber malade", english: "to get sick", theme: "Health" },
        { id: 44, french: "un quai", english: "a platform", theme: "Travel" },
        { id: 45, french: "un collègue", english: "a coworker", theme: "Work" },
        { id: 46, french: "exprimer", english: "to express", theme: "Conversation" },
        { id: 47, french: "autour de", english: "around", theme: "Common words" },
        { id: 48, french: "un placard", english: "a cupboard", theme: "Home" },
        { id: 49, french: "la sortie", english: "the exit", theme: "Places" },
        { id: 50, french: "un remboursement", english: "a refund", theme: "Shopping" },
        { id: 51, french: "un comprimé", english: "a tablet", theme: "Health" },
        { id: 52, french: "réserver", english: "to book", theme: "Travel" },
        { id: 53, french: "un délai", english: "a deadline", theme: "Work" },
        { id: 54, french: "proposer", english: "to suggest", theme: "Conversation" },
        { id: 55, french: "presque", english: "almost", theme: "Common words" },
        { id: 56, french: "une lessive", english: "laundry", theme: "Home" },
        { id: 57, french: "un rond-point", english: "a roundabout", theme: "Places" },
        { id: 58, french: "une livraison", english: "a delivery", theme: "Shopping" },
        { id: 59, french: "tousser", english: "to cough", theme: "Health" },
        { id: 60, french: "valider", english: "to validate", theme: "Travel" }
      ];

      const quizQuestions = [
        {
          pronoun: "je",
          verb: "prendre",
          tense: "présent",
          answer: "prends",
          prompt: "Je ___ le train à huit heures.",
          hint: "prendre: je prends, tu prends, il prend",
          rule: "Prendre is irregular in the present tense. The singular forms use prend-, and nous/vous use pren-.",
          conjugation: ["je prends", "tu prends", "il/elle prend", "nous prenons", "vous prenez", "ils/elles prennent"]
        },
        {
          pronoun: "nous",
          verb: "finir",
          tense: "présent",
          answer: "finissons",
          prompt: "Nous ___ nos devoirs avant le dîner.",
          hint: "Regular -ir verbs use -issons with nous.",
          rule: "Finir is a regular -ir verb. Remove -ir, then add -is, -is, -it, -issons, -issez, -issent.",
          conjugation: ["je finis", "tu finis", "il/elle finit", "nous finissons", "vous finissez", "ils/elles finissent"]
        },
        {
          pronoun: "ils",
          verb: "aller",
          tense: "présent",
          answer: "vont",
          prompt: "Ils ___ au marché le samedi.",
          hint: "aller is irregular: ils vont.",
          rule: "Aller is irregular. Memorize the full present tense pattern because the stem changes often.",
          conjugation: ["je vais", "tu vas", "il/elle va", "nous allons", "vous allez", "ils/elles vont"]
        },
        {
          pronoun: "tu",
          verb: "choisir",
          tense: "présent",
          answer: "choisis",
          prompt: "Tu ___ une nouvelle série française.",
          hint: "Regular -ir verbs use -is with tu.",
          rule: "Choisir is a regular -ir verb. Remove -ir, then add the regular present tense endings.",
          conjugation: ["je choisis", "tu choisis", "il/elle choisit", "nous choisissons", "vous choisissez", "ils/elles choisissent"]
        },
        {
          pronoun: "elle",
          verb: "faire",
          tense: "présent",
          answer: "fait",
          prompt: "Elle ___ une promenade après le travail.",
          hint: "faire is irregular: elle fait.",
          rule: "Faire is irregular in the present tense. Watch the vous form: vous faites.",
          conjugation: ["je fais", "tu fais", "il/elle fait", "nous faisons", "vous faites", "ils/elles font"]
        }
      ];

      const statusOptions = [
        { value: "unfamiliar", label: "Unfamiliar", chip: "bg-lilac text-[#4b3f85]", card: "border-[#9b8bea] bg-[#f7f4ff]" },
        { value: "learning", label: "Learning", chip: "bg-white text-slate-700", card: "border-slate-200 bg-white" },
        { value: "learned", label: "Learned", chip: "bg-white text-[#275b46]", card: "border-mint bg-[#edf7f3]" }
      ];

      const normalize = (value) =>
        value
          .trim()
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "");

      const todayKey = new Date().toISOString().slice(0, 10);

      function seededDailyWords(dateKey) {
        const seed = [...dateKey].reduce((total, char) => total + char.charCodeAt(0), 0);
        return [...wordBank]
          .map((word, index) => ({ word, sort: (index * 37 + seed * 17) % wordBank.length }))
          .sort((a, b) => a.sort - b.sort)
          .slice(0, 20)
          .map(({ word }) => word);
      }

      function useStoredState(key, initialValue) {
        const [value, setValue] = useState(() => {
          try {
            const saved = localStorage.getItem(key);
            return saved ? JSON.parse(saved) : initialValue;
          } catch {
            return initialValue;
          }
        });

        const updateValue = (nextValue) => {
          setValue((currentValue) => {
            const resolved = typeof nextValue === "function" ? nextValue(currentValue) : nextValue;
            try {
              localStorage.setItem(key, JSON.stringify(resolved));
            } catch {
              return resolved;
            }
            return resolved;
          });
        };

        return [value, updateValue];
      }

      function ProgressRing({ value }) {
        const clamped = Math.min(100, Math.max(0, value));
        return (
          <div
            className="grid h-28 w-28 place-items-center rounded-full"
            style={{
              background: `conic-gradient(#4fb286 ${clamped * 3.6}deg, #e7efed 0deg)`
            }}
            aria-label={`${clamped}% learned`}
          >
            <div className="grid h-20 w-20 place-items-center rounded-full bg-white">
              <span className="text-2xl font-bold">{clamped}%</span>
            </div>
          </div>
        );
      }

      function App() {
        const dailyWords = useMemo(() => seededDailyWords(todayKey), []);
        const [wordStatuses, setWordStatuses] = useStoredState(`a2-word-statuses-${todayKey}`, {});
        const [quizIndex, setQuizIndex] = useStoredState("a2-quiz-index", 0);
        const [quizStats, setQuizStats] = useStoredState("a2-quiz-stats", { correct: 0, total: 0, streak: 0 });
        const [answer, setAnswer] = useState("");
        const [feedback, setFeedback] = useState(null);

        const words = dailyWords.map((word) => ({ ...word, status: wordStatuses[word.id] || "learning" }));
        const learnedCount = words.filter((word) => word.status === "learned").length;
        const unfamiliarCount = words.filter((word) => word.status === "unfamiliar").length;
        const learningCount = words.length - learnedCount - unfamiliarCount;
        const progress = Math.round((learnedCount / words.length) * 100);
        const currentQuestion = quizQuestions[quizIndex % quizQuestions.length];

        const groupedWords = useMemo(() => {
          return words.reduce((groups, word) => {
            groups[word.theme] = groups[word.theme] || [];
            groups[word.theme].push(word);
            return groups;
          }, {});
        }, [words]);

        const setWordStatus = (id, status) => {
          setWordStatuses((currentStatuses) => ({ ...currentStatuses, [id]: status }));
        };

        const checkAnswer = (event) => {
          event.preventDefault();
          const isCorrect = normalize(answer) === normalize(currentQuestion.answer);

          setQuizStats((stats) => ({
            correct: stats.correct + (isCorrect ? 1 : 0),
            total: stats.total + 1,
            streak: isCorrect ? stats.streak + 1 : 0
          }));

          setFeedback({
            correct: isCorrect,
            text: isCorrect
              ? "Correct. Nice work."
              : `Good try. The answer is "${currentQuestion.answer}".`
          });
        };

        const nextQuestion = () => {
          setQuizIndex((quizIndex + 1) % quizQuestions.length);
          setAnswer("");
          setFeedback(null);
        };

        return (
          <main className="min-h-screen">
            <section className="bg-skysoft">
              <div className="mx-auto grid max-w-6xl gap-8 px-4 py-8 sm:px-6 lg:grid-cols-[1.35fr_0.65fr] lg:px-8 lg:py-12">
                <div className="flex flex-col justify-center">
                  <p className="text-sm font-semibold uppercase tracking-[0.18em] text-mint">French A2</p>
                  <h1 className="mt-3 max-w-2xl text-4xl font-bold leading-tight sm:text-5xl">
                    Small daily practice for confident French.
                  </h1>
                  <p className="mt-4 max-w-2xl text-base leading-7 text-slate-700 sm:text-lg">
                    Review 20 fresh words each day, save unfamiliar terms for later, and warm up with short conjugation prompts built for A2 study.
                  </p>
                </div>
                <div className="grid gap-3 rounded-lg bg-white p-5 shadow-soft">
                  <div className="flex items-center justify-between gap-4">
                    <div>
                      <p className="text-sm text-slate-500">Today’s vocabulary</p>
                      <p className="mt-1 text-2xl font-bold">{learnedCount} of 20 learned</p>
                    </div>
                    <ProgressRing value={progress} />
                  </div>
                  <div className="grid grid-cols-3 gap-3">
                    <div className="rounded-lg bg-[#f7fbfa] p-4">
                      <p className="text-2xl font-bold">{learningCount}</p>
                      <p className="text-sm text-slate-500">learning</p>
                    </div>
                    <div className="rounded-lg bg-lilac p-4">
                      <p className="text-2xl font-bold">{unfamiliarCount}</p>
                      <p className="text-sm text-slate-600">review later</p>
                    </div>
                    <div className="rounded-lg bg-lemon p-4">
                      <p className="text-2xl font-bold">{quizStats.streak}</p>
                      <p className="text-sm text-slate-600">quiz streak</p>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            <section className="mx-auto grid max-w-6xl gap-6 px-4 py-6 sm:px-6 lg:px-8">
              <div className="rounded-lg bg-ink p-5 text-white shadow-soft">
                <h2 className="text-xl font-bold">Daily Plan</h2>
                <p className="mt-2 text-sm leading-6 text-slate-200">
                  Learn 20 words today. Move difficult words to Unfamiliar so you know exactly what to review later.
                </p>
                <div className="mt-4 grid grid-cols-3 gap-2 text-center">
                  <div className="rounded-lg bg-white/10 p-3">
                    <p className="text-xl font-bold">20</p>
                    <p className="text-xs text-slate-300">words</p>
                  </div>
                  <div className="rounded-lg bg-white/10 p-3">
                    <p className="text-xl font-bold">{quizStats.correct}</p>
                    <p className="text-xs text-slate-300">correct</p>
                  </div>
                  <div className="rounded-lg bg-white/10 p-3">
                    <p className="text-xl font-bold">{quizStats.total ? Math.round((quizStats.correct / quizStats.total) * 100) : 0}%</p>
                    <p className="text-xs text-slate-300">accuracy</p>
                  </div>
                </div>
              </div>

              <div className="rounded-lg bg-white p-5 shadow-soft">
                <div className="flex items-start justify-between gap-4">
                  <div>
                    <h2 className="text-2xl font-bold">Verb Quiz</h2>
                    <p className="mt-1 text-sm text-slate-500">Present tense practice with instant feedback.</p>
                  </div>
                  <span className="rounded-full bg-[#ffece9] px-3 py-1 text-sm font-semibold text-coral">
                    {currentQuestion.pronoun} {currentQuestion.verb}
                  </span>
                </div>

                <div className="mt-5 rounded-lg bg-[#f7fbfa] p-4">
                  <p className="text-sm font-semibold uppercase tracking-[0.12em] text-slate-500">{currentQuestion.tense}</p>
                  <p className="mt-2 text-2xl font-bold leading-snug">{currentQuestion.prompt}</p>
                </div>

                <form onSubmit={checkAnswer} className="mt-4 grid gap-3">
                  <label className="grid gap-1 text-sm font-medium">
                    Your answer
                    <input
                      className="rounded-md border border-slate-200 px-3 py-3 text-lg outline-none focus:border-coral focus:ring-2 focus:ring-coral/20"
                      value={answer}
                      onChange={(event) => setAnswer(event.target.value)}
                      placeholder="Type the conjugation"
                    />
                  </label>
                  <button className="rounded-md bg-coral px-4 py-3 font-semibold text-white transition hover:bg-[#d85f51]">
                    Check Answer
                  </button>
                </form>

                {feedback && (
                  <div
                    className={`mt-4 rounded-lg p-4 ${
                      feedback.correct ? "bg-[#edf7f3] text-[#275b46]" : "bg-[#fff8dd] text-[#6a5315]"
                    }`}
                  >
                    <p className="font-semibold">{feedback.text}</p>
                    {!feedback.correct && <p className="mt-1 text-sm">{currentQuestion.hint}</p>}
                    <div className="mt-4 rounded-md bg-white/70 p-3">
                      <p className="text-sm font-bold text-ink">Full rule for {currentQuestion.verb}</p>
                      <p className="mt-1 text-sm">{currentQuestion.rule}</p>
                      <div className="mt-3 grid gap-2 sm:grid-cols-2 lg:grid-cols-3">
                        {currentQuestion.conjugation.map((form) => (
                          <span key={form} className="rounded-md bg-white px-3 py-2 text-sm font-semibold text-slate-700">
                            {form}
                          </span>
                        ))}
                      </div>
                    </div>
                    <button onClick={nextQuestion} className="mt-3 rounded-md bg-white px-4 py-2 text-sm font-bold text-ink">
                      Next Question
                    </button>
                  </div>
                )}
              </div>
            </section>

            <section className="mx-auto max-w-6xl px-4 pb-10 sm:px-6 lg:px-8">
              <div className="rounded-lg bg-white p-5 shadow-soft">
                <div className="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
                  <div>
                    <h2 className="text-2xl font-bold">Vocabulary Tracker</h2>
                    <p className="mt-1 text-sm text-slate-500">A new set appears each day. Mark each word by how it feels right now.</p>
                  </div>
                  <span className="w-fit rounded-full bg-[#edf7f3] px-3 py-1 text-sm font-semibold text-mint">
                    20 words today
                  </span>
                </div>

                <div className="mt-5 grid gap-4">
                  {Object.entries(groupedWords).map(([theme, themeWords]) => (
                    <div key={theme}>
                      <h3 className="mb-2 text-sm font-bold uppercase tracking-[0.12em] text-slate-500">{theme}</h3>
                      <div className="grid gap-2">
                        {themeWords.map((word) => {
                          const statusStyle = statusOptions.find((option) => option.value === word.status);
                          return (
                            <article
                              key={word.id}
                              className={`grid gap-4 rounded-lg border p-4 transition sm:grid-cols-[1fr_auto] sm:items-center ${statusStyle.card}`}
                            >
                              <div className="word-block w-fit max-w-full" tabIndex="0">
                                <p className="font-semibold">{word.french}</p>
                                <p className="word-meaning min-h-5 text-sm text-slate-500 transition">
                                  {word.english}
                                </p>
                              </div>
                              <div className="sm:w-48">
                                <label className="sr-only" htmlFor={`word-${word.id}-status`}>
                                  Status for {word.french}
                                </label>
                                <select
                                  id={`word-${word.id}-status`}
                                  value={word.status}
                                  onChange={(event) => setWordStatus(word.id, event.target.value)}
                                  className={`w-full rounded-md border border-slate-200 px-3 py-2 text-sm font-bold outline-none transition focus:border-mint focus:ring-2 focus:ring-mint/20 ${statusStyle.chip}`}
                                >
                                  {statusOptions.map((option) => (
                                    <option key={option.value} value={option.value}>
                                      {option.label}
                                    </option>
                                  ))}
                                </select>
                              </div>
                            </article>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </section>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
